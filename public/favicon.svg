<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Solid background for great visibility in both light and dark mode browser tabs -->
  <rect width="100" height="100" rx="20" fill="#0B2545" />
  
  <!-- Outer technical compass blueprint line -->
  <circle cx="50" cy="50" r="42" stroke="#4895EF" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" />
  
  <!-- Caliper arms -->
  <path d="M18 18 L50 50 L82 18" stroke="#4895EF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
  
  <!-- Left Main Gear -->
  <g stroke="#4895EF" stroke-width="4.5" stroke-linecap="round">
    <circle cx="42" cy="58" r="16" stroke="white" stroke-width="3.5" fill="#0B2545" />
    <circle cx="42" cy="58" r="8" stroke="#4895EF" stroke-width="2.5" fill="#4895EF" fill-opacity="0.2" />
    
    <!-- Teeth -->
    <path d="M42 36 L42 41" />
    <path d="M42 75 L42 80" />
    <path d="M20 58 L25 58" />
    <path d="M59 58 L64 58" />
    
    <path d="M26.5 42.5 L30 46" />
    <path d="M54 70 L57.5 73.5" />
    <path d="M57.5 42.5 L54 46" />
    <path d="M30 70 L26.5 73.5" />
  </g>

  <!-- Right Planetary Gear -->
  <g stroke="#4895EF" stroke-width="3.5" stroke-linecap="round">
    <circle cx="68" cy="42" r="11" fill="#0B2545" />
    <circle cx="68" cy="42" r="5" stroke="white" stroke-width="2" fill="white" fill-opacity="0.2" />
    
    <!-- Teeth -->
    <path d="M68 26 L68 30" />
    <path d="M68 54 L68 58" />
    <path d="M52 42 L56 42" />
    <path d="M80 42 L84 42" />
  </g>

  <!-- Pivot bolts -->
  <circle cx="42" cy="58" r="3.5" fill="white" />
  <circle cx="68" cy="42" r="2.5" fill="white" />
</svg>
